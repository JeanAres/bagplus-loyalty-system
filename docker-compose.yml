version: '3.8'

services:
  # BACKEND PRODUÇÃO
  backend-prod:
    build: .
    container_name: bagplus_backend_prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/bagplus_prod.db
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
    volumes:
      - ./storage-prod:/app/storage
      - ./data-prod:/app/data
    networks:
      - bagplus-network

  # BACKEND STAGING (TESTE)
  backend-staging:
    build: .
    container_name: bagplus_backend_staging
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/bagplus_staging.db
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=staging
    volumes:
      - ./storage-staging:/app/storage
      - ./data-staging:/app/data
    networks:
      - bagplus-network

networks:
  bagplus-network:
    driver: bridge
